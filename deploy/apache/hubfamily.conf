# HUB FAMILY 아파치 vhost
# 대상 서버의 실제 설정 경로: /usr/local/httpd2/conf.d/hubfamily.conf
#   (/usr/local/apache 는 이 경로의 심볼릭 링크)
#
# 적용:
#   /usr/local/apache/bin/httpd -t          # Syntax OK 확인
#   /usr/local/apache/bin/apachectl graceful
#
# 이 서버는 사이트 100여 개가 함께 돈다. restart 가 아니라 graceful 을 쓴다.

<VirtualHost *:80>
    ServerAdmin webmaster@mangotree.co.kr
    DocumentRoot /home/hubfamily
    ServerName hubfamily.mangotree.co.kr

    # API → Docker 컨테이너 (api 서비스)
    ProxyPreserveHost On
    ProxyPass        /api/  http://127.0.0.1:8000/api/
    ProxyPassReverse /api/  http://127.0.0.1:8000/api/

    # 식사 사진 등 업로드 파일
    Alias /uploads/ /home/hubfamily/uploads/
    <Directory /home/hubfamily/uploads>
        Require all granted
        Options -Indexes
    </Directory>

    # DocumentRoot 가 홈 디렉터리라 점파일 노출을 막는다
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # 웹앱은 SPA 라 새로고침·딥링크가 서버 경로로 들어온다.
    # 없는 경로는 index.html 로 넘겨 라우팅을 앱에 맡긴다.
    # (/api/ 는 위 ProxyPass 가, /uploads/ 는 Alias 가 먼저 처리한다)
    <Directory /home/hubfamily>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    CustomLog logs/hubfamily-access_log common
    CBandLimit 10000M
    CBandPeriod 1D
</VirtualHost>

# ── HTTPS ─────────────────────────────────────────────────────────
# 인증서 발급 후 아래 블록을 추가한다. ProxyPass 3줄을 여기에도 넣어야 한다.
#
# <VirtualHost *:443>
#     ServerAdmin webmaster@mangotree.co.kr
#     DocumentRoot /home/hubfamily
#     ServerName hubfamily.mangotree.co.kr
#
#     SSLEngine on
#     SSLCertificateFile    /실제/인증서/fullchain.pem
#     SSLCertificateKeyFile /실제/인증서/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyPass        /api/  http://127.0.0.1:8000/api/
#     ProxyPassReverse /api/  http://127.0.0.1:8000/api/
#
#     Alias /uploads/ /home/hubfamily/uploads/
#     <Directory /home/hubfamily/uploads>
#         Require all granted
#         Options -Indexes
#     </Directory>
#
#     <FilesMatch "^\.">
#         Require all denied
#     </FilesMatch>
#
#     Header always set Strict-Transport-Security "max-age=31536000"
#
#     CustomLog logs/hubfamily-ssl_access_log common
#     CBandLimit 10000M
#     CBandPeriod 1D
# </VirtualHost>
